[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "favilla"
version = "0.1.0"
description = "Lighting and settings for SteelSeries keyboards and mice on Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "fontanamichele" }]
keywords = ["steelseries", "rgb", "keyboard", "mouse", "linux", "hid", "lighting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
# PyGObject (D-Bus) and PySide6 (interface) are best taken from the distribution:
# see the README.
dependencies = ["rivalcfg>=4.13"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.urls]
Homepage = "https://github.com/fontanamichele/favilla"

[project.scripts]
favillad = "favilla.daemon:main"
favillactl = "favilla.cli:main"

[project.gui-scripts]
favilla = "favilla.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"favilla.gui" = ["qml/*.qml", "favilla.svg", "i18n/*.qm"]
